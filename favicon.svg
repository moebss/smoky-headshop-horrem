<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="35%" stop-color="#dfc476"/>
      <stop offset="70%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#8a6922"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc476" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a6922" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#c9a84c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b0b0e" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="#0b0b0e"/>
  <rect width="512" height="512" rx="110" fill="url(#ambientGlow)"/>

  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#dfc476" stroke-width="3" stroke-opacity="0.4"/>

  <text x="256" y="375" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="340" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">S</text>
</svg>